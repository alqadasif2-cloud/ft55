name: Build Sami Android APK

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-android-apk:
    name: Build & Package Sami Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install Web dependencies
        run: |
          echo "Installing dependencies..."
          npm install --legacy-peer-deps

      - name: 4. Build Web App & Update Android Assets
        run: |
          echo "Building production Web application..."
          npm run build
          echo "Cleaning stale assets..."
          rm -rf app/src/main/assets/assets
          rm -f app/src/main/assets/*.zip
          rm -f dist/*.zip
          echo "Syncing built bundle into Android assets..."
          mkdir -p app/src/main/assets
          cp -r dist/* app/src/main/assets/
          rm -f app/src/main/assets/*.zip
          ls -la app/src/main/assets/

      - name: 5. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 6. Grant execute permissions for Gradle wrapper
        run: chmod +x ./gradlew

      - name: 7. Verify Signing Keystore
        run: |
          echo "Validating keystore..."
          if [ -f app/sami-signing-key.p12 ]; then
            echo "Universal signing key found at app/sami-signing-key.p12."
            keytool -list -keystore app/sami-signing-key.p12 -storepass samitrading -storetype PKCS12 || echo "Keystore listed"
          else
            echo "Generating new signing keystore..."
            keytool -genkeypair -v \
              -keystore app/sami-signing-key.p12 \
              -storetype PKCS12 \
              -storepass samitrading \
              -keypass samitrading \
              -alias sami \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Sami Trading Challenge, OU=Mobile, O=Sami, L=Riyadh, ST=Riyadh, C=SA"
          fi

      - name: 8. Build Universal Signed Release APK with Gradle
        run: |
          echo "Building single Universal Release APK..."
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 9. Verify Generated Release APK and Prepare Single Deliverable
        run: |
          mkdir -p build_output_apk

          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK was not generated in app/build/outputs/apk/release/!"
            exit 1
          fi

          RELEASE_SIZE=$(stat -c%s "$RELEASE_APK" 2>/dev/null || stat -f%z "$RELEASE_APK")
          RELEASE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $RELEASE_SIZE / 1048576}")
          echo "Found Release APK: $RELEASE_APK"
          echo "Release APK size: $RELEASE_SIZE bytes (~$RELEASE_SIZE_MB MB)"

          if [ "$RELEASE_SIZE" -lt 1000000 ]; then
            echo "::error::Release APK exists but is suspiciously small ($RELEASE_SIZE bytes)."
            exit 1
          fi

          # Copy as the single standardized APK
          cp "$RELEASE_APK" build_output_apk/Sami-Android.apk
          echo "Single deliverable created at build_output_apk/Sami-Android.apk"

          # Verify that exactly one APK file exists in the directory
          TOTAL_APKS=$(ls -1 build_output_apk/*.apk 2>/dev/null | wc -l)
          if [ "$TOTAL_APKS" -ne 1 ]; then
            echo "::error::Expected exactly 1 APK file in build_output_apk, but found $TOTAL_APKS"
            exit 1
          fi

          echo "=========================================="
          echo "SUCCESS: Single production APK ready:"
          ls -lh build_output_apk/Sami-Android.apk
          echo "=========================================="

          # Output to GitHub Step Summary
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### 🚀 Sami Android App Build Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Deliverable**: \`Sami-Android.apk\` (Single universal installable package)" >> $GITHUB_STEP_SUMMARY
            echo "- **Package ID**: \`com.sami.tradingchallengetracker\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`1.3.0\` (Build 11)" >> $GITHUB_STEP_SUMMARY
            echo "- **Size**: \`${RELEASE_SIZE_MB} MB\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Target Architecture**: Universal (arm64-v8a, armeabi-v7a, x86, x86_64)" >> $GITHUB_STEP_SUMMARY
            echo "- **Target Android**: Android 7.0+ (API 24 to 34)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ The APK is ready for direct installation on Android devices via Artifacts download." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 10. Upload Single Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sami-Android-APK
          path: build_output_apk/Sami-Android.apk
          if-no-files-found: error
          retention-days: 30

